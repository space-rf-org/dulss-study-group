# GitHub Pages / Jekyll site settings (does not affect GitHub README content)
title: Designing Ultra Large Scale Systems Study Group
description: >-
  A community for engineers who want to go deep on distributed systems,
  data algorithms, and production-scale designs — through papers, code,
  and careful critique.
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Do not replace GitHub Pages' default plugin set. In particular we need
# jekyll-readme-index so README.md is published as the site homepage (/).
# Listing only a subset of plugins (e.g. jekyll-seo-tag alone) drops that
# plugin and makes / return 404 while other paths still work.
