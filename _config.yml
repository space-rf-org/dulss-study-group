# GitHub Pages / Jekyll site settings (does not affect GitHub README content)
title: Designing Ultra Large Scale Systems Study Group
description: >-
  A community for engineers who want to go deep on distributed systems,
  data algorithms, and production-scale designs — through papers, code,
  and careful critique.

# Absolute URLs for Open Graph / LinkedIn / Twitter unfurls
url: "https://space-rf-org.github.io"
baseurl: "/dulss-study-group"
# Used by jekyll-github-metadata locally and on Pages
repository: space-rf-org/dulss-study-group

theme: jekyll-theme-primer
show_downloads: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Plugins used by GitHub Pages. List them explicitly so local `jekyll serve`
# (Podman preview) matches production.
plugins:
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-titles-from-headings
  - jekyll-github-metadata

# Publish root README.md as the site homepage (/).
readme_index:
  enabled: true
  with_frontmatter: true

# Apply theme layout + social image to all pages
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/social-card.png
        width: 1200
        height: 627
        alt: Designing Ultra Large Scale Systems Study Group
