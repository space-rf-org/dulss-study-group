<h2 id="tigerbeetle"><a href="https://tigerbeetle.com">TigerBeetle</a></h2>
<ul>
<li>A financial transactions database purpose-built for high-performance OLTP</li>
<li>Reimagines debit/credit as a <strong>first-class primitive</strong> (not just SQL queries and locks)</li>
<li>Aims for massive gains in correctness, safety, and speed at scale</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="9" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="tigerbeetle-1"><a href="https://tigerbeetle.com">TigerBeetle</a></h2>
<ul>
<li>Strict consistency with double-entry bookkeeping built-in</li>
<li>Batch thousands of transfers per query; eliminates traditional contention bottlenecks</li>
<li>Designed from first principles: durability, multi-cloud availability, extreme throughput</li>
</ul>
</section>

<h2 id="recap-part-1-takeaways">Recap: Part 1 Takeaways</h2>
<p>Last session: debit/credit as a first-class primitive.</p>
<p><strong>Slides:</strong> <a href="https://space-rf-org.github.io/dulss-study-group/#presentations">Presentations index</a></p>
<p>Main takeaways from Part 1:</p>
<ul>
<li><strong>No DDL</strong> — TigerBeetle has no schema language</li>
<li><strong>Fixed schema</strong> — you cannot change the schema</li>
<li><strong>No SQL / query language</strong> — not a general-purpose query engine</li>
<li><strong>API only</strong> — access is via the client API (accounts, transfers, …)</li>
<li><strong>Result:</strong> highly specialized and <strong>highly performant</strong> for debit/credit workloads</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="13" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="prerequisite-readings--what-i-took-away">Prerequisite Readings — What I Took Away</h2>
<ul>
<li><strong><a href="https://www.youtube.com/watch?v=_jfOk4L7CiY">QCon London ’23: A New Era for Database Design</a></strong> — deeper on <strong>disk writes</strong> and <strong>disk failure</strong> handling</li>
<li><strong><a href="https://www.youtube.com/watch?v=sC1B3d9C_sI">Primeagen interview: TigerBeetle</a></strong> — good <strong>animated consensus demo</strong>; more visual</li>
<li><strong><a href="https://www.youtube.com/watch?v=tRgvaqpQPwE">Durability and the Art of Consensus</a></strong> — <strong>much deeper</strong> on the <strong>consensus protocol</strong> (durability + safety)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="14" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="tigerbeetle-workload-characteristics">TigerBeetle Workload Characteristics</h2>
<p>From the <a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/ARCHITECTURE.md#problem-statement">TigerBeetle Architecture — Problem Statement</a>:</p>
<p>TigerBeetle is a database for workloads that:</p>
<ol>
<li>Have <strong>contended</strong> access and <strong>parallelize/shard poorly</strong> (Amdahl’s Law)</li>
<li>Consist <strong>mostly of writes</strong></li>
<li>Need <strong>very high throughput</strong> and <strong>moderately low latency</strong></li>
<li>Require <strong>strong consistency</strong> guarantees</li>
<li>Demand <strong>very high levels of durability</strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="lead" data-theme="rust-demo" lang="en-US" class="lead" data-marpit-pagination="15" style="--paginate:true;--class:lead;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="durability-and-the-art-of-consensus">Durability and the Art of Consensus</h2>
<h3 id="watch-joran-dirk-greef"><a href="https://www.youtube.com/watch?v=tRgvaqpQPwE">Watch: Joran Dirk Greef</a></h3>
<p>A deeper take on consensus <strong>through the lens of durability</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="16" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="the-thesis">The Thesis</h2>
<blockquote>
<p><strong>Availability is a function of durability —<br />
and consensus is that function.</strong></p>
</blockquote>
<ul>
<li>You don’t get availability “for free”</li>
<li>You get availability by <strong>preserving durable history</strong> across replicas</li>
<li>Consensus is the algorithm that turns local durability into <strong>cluster availability</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="17" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="from-physical-%E2%86%92-logical">From Physical → Logical</h2>
<p>The talk reframes how we think about safety:</p>
<table>
<thead>
<tr>
<th></th>
<th>Physical</th>
<th>Logical</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Durability</strong></td>
<td>Bytes survive on disk / machine</td>
<td>History is not lost for the cluster</td>
</tr>
<tr>
<td><strong>Availability</strong></td>
<td>A node can serve</td>
<td>The <strong>system</strong> can keep making progress</td>
</tr>
</tbody>
</table>
<ul>
<li>Consensus maps <strong>physical durability</strong> → <strong>logical durability</strong></li>
<li>Then logical durability → <strong>availability</strong> under faults</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="18" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="why-durability-comes-first">Why Durability Comes First</h2>
<ul>
<li>Without <strong>D</strong> in ACID, A/C/I have nothing durable to guarantee</li>
<li>Disks fail; machines fail; <code>fsync</code> success ≠ forever-safe data</li>
<li>If you treat storage as perfect, consensus designs <strong>underestimate</strong> real faults</li>
<li>TigerBeetle’s view: design consensus <strong>assuming storage faults</strong>, then use replica redundancy to repair</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="19" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="consensus-as-the-utility-function">Consensus as the Utility Function</h2>
<ul>
<li>Consensus converts durability into availability</li>
<li>Replicate durable prepares so a quorum can survive crashes / partitions</li>
<li>View change / primary failover: recover <strong>without losing committed durability</strong></li>
<li>Optimal consensus ≈ maximizing availability <strong>given</strong> the durability you can actually keep</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="20" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="viewstamped-replication--two-papers">Viewstamped Replication — Two Papers</h2>
<p>From the pre-work (slide 7):</p>
<ol>
<li>
<p><strong><a href="https://www.cs.princeton.edu/courses/archive/fall11/cos518/papers/viewstamped.pdf">VR (1988)</a></strong> — Oki &amp; Liskov<br />
Original primary-copy method for highly available distributed systems</p>
</li>
<li>
<p><strong><a href="https://dspace.mit.edu/entities/publication/80846d94-fcd3-40e6-87fb-8d91fe99a5d1">VR Revisited (2012)</a></strong> — Liskov &amp; Cowling<br />
Cleaner, modern restatement — <strong>improves on / supersedes</strong> the 1988 presentation for implementers</p>
</li>
</ol>
<p><strong>TigerBeetle follows the second paper</strong> (VRR), not the 1988 description as-written.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="21" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="viewstamp-is-a-leftover-name">“Viewstamp” Is a Leftover Name</h2>
<ul>
<li>The word <strong>Viewstamp</strong> comes from the <strong>1988</strong> paper</li>
<li>In <strong>VR Revisited (2012)</strong>, that term is largely a <strong>historical leftover</strong></li>
<li>What matters operationally: <strong>views</strong>, <strong>primaries</strong>, <strong>ops / log</strong>, <strong>quorums</strong>, <strong>view change</strong></li>
<li>TigerBeetle still says <strong>VSR</strong> (<em>Viewstamped</em> Replication) in code/docs — the <em>stamp</em> branding is legacy; the protocol is the <strong>revisited</strong> design</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="22" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="vr-1988--building-blocks">VR 1988 — Building Blocks</h2>
<p>From Oki &amp; Liskov (original paper):</p>
<ul>
<li><strong>Module</strong> — data + code on one node; unit of replication; talks via RPC</li>
<li><strong>Module group / cohort</strong> — several replicas that behave as one module</li>
<li><strong>Configuration</strong> — the set of cohorts; each has a <strong>mid</strong> / <strong>groupId</strong></li>
<li><strong>Primary</strong> — the active replica that handles client requests and coordinates the backups</li>
<li><strong>Backups</strong> — passive; receive state from the primary</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="23" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="vr-1988--views">VR 1988 — Views</h2>
<ul>
<li><strong>View</strong> — cohorts that can communicate + which one is <strong>primary</strong>
<ul>
<li>Subset of the configuration; must contain a <strong>majority</strong></li>
<li>Identified by a unique <strong>viewId</strong></li>
</ul>
</li>
<li><strong>View change</strong> — group switches to a new view / new viewId (totally ordered)
<ul>
<li>Triggered when communication with a module fails</li>
<li>New view becomes <strong>active</strong> if a majority accepts; else views stay inactive</li>
</ul>
</li>
<li><strong>Active view</strong> — only here are transactions processed</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="24" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="vr-1988--events--viewstamps">VR 1988 — Events &amp; Viewstamps</h2>
<ul>
<li><strong>Event</strong> — primary needs to tell backups something (e.g. prepare / commit)</li>
<li><strong>Timestamp</strong> — unique id for an event (usually a counter)</li>
<li><strong>Event record</strong> — FIFO info about the event (incl. timestamps), sent in order</li>
<li><strong>Viewstamp</strong> = <code>viewId</code> ∥ <code>timestamp</code> — the original compound id</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>viewstamp { viewId, timestamp }
</code></pre>
<ul>
<li><strong>pset</strong> — per-transaction set of <code>&lt;groupId, viewstamp&gt;</code> entries</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="25" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="vr-revisited-2012--what-got-simpler">VR Revisited (2012) — What Got Simpler</h2>
<p>The 2012 paper <strong>drops / simplifies</strong> much of the 1988 vocabulary:</p>
<table>
<thead>
<tr>
<th>1988</th>
<th>2012</th>
</tr>
</thead>
<tbody>
<tr>
<td>module / cohort</td>
<td><strong>replica</strong> in a replica group</td>
</tr>
<tr>
<td>event / event log on disk</td>
<td><strong>log</strong> (can be in memory + replicated)</td>
</tr>
<tr>
<td>timestamp / viewstamp-centric</td>
<td><strong>op-number</strong>, <strong>view</strong>, prepare/commit</td>
</tr>
<tr>
<td>heavyweight module RPC framing</td>
<td>clearer <strong>primary + backups</strong> service model</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="26" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="fault-threshold-f">Fault Threshold <strong>f</strong></h2>
<ul>
<li><strong>f</strong> = maximum number of <strong>faulty nodes</strong> the system is designed to tolerate</li>
<li>Replica group size: at least <strong>2f + 1</strong></li>
<li>If <strong>f</strong> replicas are down, a quorum is still possible with <strong>f + 1</strong> (a majority)</li>
<li>That majority quorum is how VR keeps <strong>reliability and availability</strong> under faults</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="quorum-slide" data-theme="rust-demo" lang="en-US" class="quorum-slide" data-marpit-pagination="27" style="--paginate:true;--class:quorum-slide;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="example-f--2-%E2%86%92-2f--1--5-replicas">Example: <strong>f = 2</strong> → <strong>2f + 1 = 5</strong> replicas</h2>
<p class="quorum-lead">Even with <strong>f = 2</strong> faulty nodes, a majority quorum of <strong>f + 1 = 3</strong> can still make progress.</p>
<div class="quorum-diagram">
<div class="quorum-formula">
  <span><strong>f = 2</strong> faults tolerated</span>
  <span><strong>2f + 1 = 5</strong> replicas</span>
  <span><strong>f + 1 = 3</strong> quorum (majority)</span>
</div>
<div class="quorum-row">
  <div class="replica primary quorum"><span class="role">Primary</span><span class="name">R0</span></div>
  <div class="replica quorum"><span class="role">Backup</span><span class="name">R1</span></div>
  <div class="replica quorum"><span class="role">Backup</span><span class="name">R2</span></div>
  <div class="replica faulty"><span class="role">Faulty</span><span class="name">R3</span></div>
  <div class="replica faulty"><span class="role">Faulty</span><span class="name">R4</span></div>
</div>
<div class="quorum-legend">
  <span class="lg-primary"><i></i>Primary (in quorum)</span>
  <span class="lg-quorum"><i></i>Live backup (in quorum)</span>
  <span class="lg-faulty"><i></i>Faulty / down (≤ f)</span>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="28" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="why-the-revisited-paper-matters">Why the Revisited Paper Matters</h2>
<ul>
<li>Same family of idea: <strong>primary-copy</strong> replicated state machine</li>
<li><strong>Easier to implement and reason about</strong> than the 1988 write-up</li>
<li>Terminology matches what systems (and TigerBeetle) actually ship</li>
<li>“Viewstamp” remains in the <strong>name</strong>; the <strong>protocol you study</strong> is VRR</li>
<li>Next: how TigerBeetle maps VRR onto prepares, WAL, and quorums</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="29" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="what-vr-revisited-gives-you">What VR Revisited Gives You</h2>
<p>Core idea (VRR): a <strong>replicated state machine</strong> with a single primary</p>
<ul>
<li>Primary orders client requests into a log (<strong>ops</strong>)</li>
<li>Backups accept/replicate prepares and ack</li>
<li>Commit when a <strong>replication quorum</strong> has durable prepares</li>
<li>On primary failure: <strong>view change</strong> elects a new primary and rebuilds a safe log suffix</li>
<li>Goal: <strong>no loss of committed history</strong> across failover</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="30" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="tigerbeetles-vsr-architecture">TigerBeetle’s VSR (Architecture)</h2>
<p>From <a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/ARCHITECTURE.md">ARCHITECTURE.md</a> + <a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md">vsr.md</a>:</p>
<ul>
<li>Cluster of replicas; consensus keeps <strong>data files identical</strong></li>
<li>Ground truth: hash-chained append-only log of <strong>prepares</strong> (batches of transfers)</li>
<li>Primary: accept → order → WAL append → replicate → wait for <code>prepare_ok</code> quorum → commit</li>
<li>Backups execute committed prepares in order (deterministic state machine)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="diagram" data-theme="rust-demo" lang="en-US" class="diagram" data-marpit-pagination="31" style="--paginate:true;--class:diagram;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="consensus-write-path-from-vsrmd">Consensus Write Path (from <a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md#protocol-normal"><code>vsr.md</code></a>)</h2>
<p><img src="assets/vsr-normal-protocol.png" alt="Normal protocol: client request, prepare chain, prepare_ok, reply" /></p>
<div class="diagram-caption">
<p>From <a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md#protocol-normal">Protocol: Normal</a> — request → prepare → <code>prepare_ok</code> → reply</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="32" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="tigerbeetle-vsr--notable-choices">TigerBeetle VSR — Notable Choices</h2>
<ul>
<li><strong>Flexible quorums</strong> (e.g. 6 replicas): replicate with <strong>3</strong>, view-change with <strong>4</strong> (<a href="https://fpaxos.github.io/">Flexible Paxos</a>)</li>
<li><strong>Protocol-aware recovery / NACKs</strong> — handle <strong>corrupt WAL</strong> entries safely during view change</li>
<li><strong>Storage faults assumed</strong> — repair prepares/blocks from peers using checksums</li>
<li>Persist VSR state in <strong>superblock</strong> (no classic VRR “Recovery Protocol”)</li>
<li>Pipelined replication: concurrent WAL write + replicate; commit needn’t wait on primary’s own write</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="33" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="putting-it-together">Putting It Together</h2>
<table>
<thead>
<tr>
<th>Layer</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>VR Revisited</strong></td>
<td>Spec TigerBeetle implements (primary / views / quorums)</td>
</tr>
<tr>
<td><strong>ARCHITECTURE.md</strong></td>
<td>How that maps to prepares, WAL, RSM, durability</td>
</tr>
<tr>
<td><strong>Durability talk</strong></td>
<td>Why: availability = <em>f</em>(durability); consensus = that <em>f</em></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="34" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="why-vsr-jorans-take">Why VSR? (Joran’s take)</h2>
<p>From <a href="https://www.youtube.com/watch?v=tRgvaqpQPwE&amp;t=1698s">Durability and the Art of Consensus</a> (~28:18):</p>
<ul>
<li><strong>VR Revisited</strong> is one of the <strong>clearest</strong> papers for learning consensus</li>
<li><strong>Raft</strong> (2 years later) is <em>remarkably similar</em> to VSR — essentially the same protocol</li>
<li>…except Raft <strong>missed a big idea</strong> that Liskov &amp; Cowling put in VRR</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="35" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="advantage-deterministic-next-primary">Advantage: Deterministic Next Primary</h2>
<p>When the primary fails, VSR already knows <strong>almost certainly</strong> who is next<br />
(<a href="https://www.youtube.com/watch?v=tRgvaqpQPwE&amp;t=1698s">Joran ~28:18</a>):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">p</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">m</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">y</mi></mrow><mo stretchy="false">(</mo><mi>v</mi><mo stretchy="false">)</mo><mtext>  </mtext><mo>=</mo><mtext>  </mtext><mi>v</mi><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>N</mi></mrow><annotation encoding="application/x-tex">\mathrm{primary}(v) \;=\; v \bmod N
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm" style="margin-right:0.0139em;">primary</span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord"><span class="mord mathrm">mod</span></span></span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span></span></p><ul>
<li>(v) = <strong>view-number</strong> (increment each time you need a new primary)</li>
<li>(N) = number of replicas</li>
<li>No open-ended “election scramble” — failover stays <strong>elegant</strong> and fast</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="36" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="advantage-disk-or-memory--recovery">Advantage: Disk <em>or</em> Memory (+ recovery)</h2>
<p>Other VSR ideas Joran highlights:</p>
<ul>
<li>Can run <strong>on disk</strong> (what a real backup / DB system needs)</li>
<li><em>Or</em> can run <strong>in memory</strong> (lighter deployments / teaching / testing shapes)</li>
<li>Extra <strong>recovery protocol</strong> when machines crash a lot (VRR’s recovery path)
<ul>
<li>TigerBeetle instead persists VSR state in the <strong>superblock</strong> (see earlier slide)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="37" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="takeaway">Takeaway</h2>
<ul>
<li>Study <strong>VR Revisited</strong> for the protocol shape</li>
<li>Notice what Raft copied — and what it <strong>didn’t</strong> (deterministic primary succession)</li>
<li>TigerBeetle’s VSR is that lineage, engineered for <strong>durability → availability</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="lead" data-theme="rust-demo" lang="en-US" class="lead" data-marpit-pagination="38" style="--paginate:true;--class:lead;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="view-change-protocol">View-Change Protocol</h2>
<h3 id="vr-revisited-%C2%A742--in-depth">VR Revisited §4.2 — in depth</h3>
<p><a href="https://www.youtube.com/watch?v=Wii1LX_ltIs&amp;t=1087s">Paper talk walkthrough</a> (~18:07)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="39" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="when-does-view-change-happen">When Does View Change Happen?</h2>
<ul>
<li>Backups <strong>monitor</strong> the primary (expect regular traffic)</li>
<li>Busy: <strong><code>prepare</code></strong> messages; idle: <strong><code>commit</code></strong> keep-alives</li>
<li>If a <strong>timeout</strong> expires without a <strong><code>commit</code></strong> → broadcast <strong><code>exit_view</code></strong></li>
<li>Goal: switch to a <strong>new primary</strong> <strong>without losing committed ops</strong></li>
<li>Quorum intersection still matters: enough replicas’ journals so committed ops are known</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="40" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="deterministic-new-primary">Deterministic New Primary</h2>
<p>Same rule as before — everyone can compute the next primary locally:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">p</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">m</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">y</mi></mrow><mo stretchy="false">(</mo><mi>v</mi><mo stretchy="false">)</mo><mtext>  </mtext><mo>=</mo><mtext>  </mtext><mi>v</mi><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>N</mi></mrow><annotation encoding="application/x-tex">\mathrm{primary}(v) \;=\; v \bmod N
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm" style="margin-right:0.0139em;">primary</span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord"><span class="mord mathrm">mod</span></span></span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span></span></p><ul>
<li>Group membership is fixed within an epoch; (v) only goes up</li>
<li><strong>No Raft-style election scramble</strong> — that is the “big idea” Raft largely missed</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="41" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="vrr-%E2%86%94-tigerbeetle-names">VRR <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> TigerBeetle names</h2>
<p>TigerBeetle follows VRR ideas but uses different command names<br />
(<a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md">vsr.md</a>):</p>
<table>
<thead>
<tr>
<th>VRR paper</th>
<th>TigerBeetle (<code>vsr.md</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>StartViewChange</strong></td>
<td><strong><code>exit_view</code></strong></td>
</tr>
<tr>
<td><strong>DoViewChange</strong></td>
<td><strong><code>join_view</code></strong></td>
</tr>
<tr>
<td><strong>StartView</strong></td>
<td><strong><code>view</code></strong> (often with <strong><code>get_view</code></strong>)</td>
</tr>
<tr>
<td><strong>PrepareOK</strong></td>
<td><strong><code>prepare_ok</code></strong></td>
</tr>
<tr>
<td>status <code>view-change</code></td>
<td>status <strong><code>view_change</code></strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="42" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="who-sends-exit_view">Who sends <strong><code>exit_view</code></strong>?</h2>
<p><strong>Backups</strong>, when the primary goes quiet<br />
(<a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md">vsr.md</a>).</p>
<ul>
<li>No timely <strong><code>commit</code></strong> → broadcast <strong><code>exit_view</code></strong></li>
<li>Means: “this view looks unhealthy — change views”</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="43" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="who-sends-join_view">Who sends <strong><code>join_view</code></strong>?</h2>
<p>Replicas that have entered the <strong>next</strong> view’s change.</p>
<ul>
<li>After a view-change quorum of <strong><code>exit_view</code></strong>, send <strong><code>join_view</code></strong> (with log/header state)</li>
<li>The <strong>new primary</strong> is who <strong>collects</strong> that quorum</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="44" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="who-sends-view">Who sends <strong><code>view</code></strong>?</h2>
<p>Only the <strong>new primary</strong>.</p>
<ul>
<li>Once it has a view-change quorum of <strong><code>join_view</code></strong> and a safe suffix → status <code>normal</code></li>
<li>Broadcasts <strong><code>view</code></strong>: “view <em>v</em> is installed — follow me”</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="45" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="put-together">Put Together</h2>
<ol>
<li><strong>Detect</strong> — timeouts / missing <strong><code>commit</code></strong></li>
<li><strong>Many replicas send <code>exit_view</code></strong></li>
<li><strong>Replicas send <code>join_view</code></strong> — new primary <strong>gathers</strong> a view-change quorum</li>
<li><strong>New primary alone publishes <code>view</code></strong></li>
<li>Repair / catch up as needed; cluster resumes <strong>normal</strong> writes</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-class="quorum-slide" data-theme="rust-demo" lang="en-US" class="quorum-slide" data-marpit-pagination="46" style="--paginate:true;--class:quorum-slide;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="view-change-flow-illustration">View-Change Flow (illustration)</h2>
<p class="quorum-lead">TigerBeetle default: <strong>N = 6</strong>, view-change quorum <strong>4</strong>. Primary <strong>R0</strong> fails → new primary <strong>R1</strong>.</p>
<div class="vc-diagram">
<div class="vc-step">
  <div class="vc-num">1</div>
  <div class="vc-body"><strong>Detect</strong><span>R1–R5 timeout on R0</span></div>
</div>
<div class="vc-arrow">→</div>
<div class="vc-step">
  <div class="vc-num">2</div>
  <div class="vc-body"><strong>exit_view</strong><span>broadcast</span></div>
</div>
<div class="vc-arrow">→</div>
<div class="vc-step">
  <div class="vc-num">3</div>
  <div class="vc-body"><strong>join_view</strong><span>→ new primary R1<br />+ headers / suffix</span></div>
</div>
<div class="vc-arrow">→</div>
<div class="vc-step">
  <div class="vc-num">4</div>
  <div class="vc-body"><strong>view</strong><span>R1 installs view;<br />others catch up</span></div>
</div>
</div>
<div class="quorum-row">
  <div class="replica faulty"><span class="role">Was primary</span><span class="name">R0</span></div>
  <div class="replica primary quorum"><span class="role">Primary · in quorum</span><span class="name">R1</span></div>
  <div class="replica quorum"><span class="role">In quorum</span><span class="name">R2</span></div>
  <div class="replica quorum"><span class="role">In quorum</span><span class="name">R3</span></div>
  <div class="replica quorum"><span class="role">In quorum</span><span class="name">R4</span></div>
  <div class="replica"><span class="role">Live (extra)</span><span class="name">R5</span></div>
</div>
<p class="quorum-lead">Highlighted <strong>R1–R4</strong> = view-change quorum of <strong>4</strong>. <strong>R5</strong> can be live but is not required for that minimum.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="47" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="after-view">After <code>view</code></h2>
<ul>
<li>Backups install suffix/checkpoint from the primary’s <strong><code>view</code></strong></li>
<li>Repair missing headers/prepares (<code>get_headers</code> / <code>get_prepare</code>) as needed</li>
<li>Send <strong><code>prepare_ok</code></strong> for uncommitted ops still in the log</li>
<li>Execute committed ops not yet applied; status back to <strong><code>normal</code></strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="48" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="three-different-questions">Three Different Questions</h2>
<p>TigerBeetle doesn’t use one “majority” for everything<br />
(<a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md#quorums">vsr.md — Quorums</a>):</p>
<table>
<thead>
<tr>
<th>Quorum</th>
<th>Question it answers</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Replication</strong></td>
<td>How many replicas must confirm they stored a prepare before the cluster <strong>commits</strong> it?</td>
</tr>
<tr>
<td><strong>View-change</strong></td>
<td>How many replicas must participate to <strong>finish a view change</strong>?</td>
</tr>
<tr>
<td><strong>Nack</strong></td>
<td>How many “I never accepted that op” signals to <strong>safely drop</strong> it?</td>
</tr>
</tbody>
</table>
<p>Different decisions → <strong>different thresholds</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="49" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="nack--a-tiny-story">Nack — a tiny story</h2>
<ol>
<li>Primary starts prepare <strong>C</strong>; only <strong>one</strong> replica has anything about it; client never got a reply</li>
<li>Primary dies; disks are messy</li>
<li>New primary asks during view change: who has <strong>C</strong>?</li>
<li>If a <strong>nack quorum</strong> says “never accepted <strong>C</strong>,” <strong>truncate</strong> it</li>
<li>If <strong>C</strong> might have committed, you <strong>must not</strong> truncate — <strong>repair</strong> instead</li>
</ol>
<p>This is the idea behind<br />
<a href="https://www.usenix.org/system/files/conference/fast18/fast18-alagappan.pdf"><strong>Protocol-Aware Recovery</strong></a> (FAST ’18).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="50" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="how-to-read-the-quorum-table">How to Read the Quorum Table</h2>
<p>Defaults from <code>vsr.md</code> — pick a cluster size (N), then read down the column:</p>
<table>
<thead>
<tr>
<th style="text-align:right">Replica count (N)</th>
<th style="text-align:right">1</th>
<th style="text-align:right">2</th>
<th style="text-align:right">3</th>
<th style="text-align:right">4</th>
<th style="text-align:right">5</th>
<th style="text-align:right"><strong>6</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right"><strong>Replication</strong></td>
<td style="text-align:right">1</td>
<td style="text-align:right">2</td>
<td style="text-align:right">2</td>
<td style="text-align:right">2</td>
<td style="text-align:right">3</td>
<td style="text-align:right"><strong>3</strong></td>
</tr>
<tr>
<td style="text-align:right"><strong>View-change</strong></td>
<td style="text-align:right">1</td>
<td style="text-align:right">2</td>
<td style="text-align:right">2</td>
<td style="text-align:right">3</td>
<td style="text-align:right">3</td>
<td style="text-align:right"><strong>4</strong></td>
</tr>
<tr>
<td style="text-align:right"><strong>Nack</strong></td>
<td style="text-align:right">1</td>
<td style="text-align:right">1</td>
<td style="text-align:right">2</td>
<td style="text-align:right">3</td>
<td style="text-align:right">3</td>
<td style="text-align:right"><strong>4</strong></td>
</tr>
</tbody>
</table>
<p>Example <strong>(N = 6)</strong> (recommended): commit with <strong>3</strong>, change views with <strong>4</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="51" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="what-that-means-for-n--6">What That Means for (N = 6)</h2>
<table>
<thead>
<tr>
<th></th>
<th style="text-align:right">Size</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td>Replication</td>
<td style="text-align:right"><strong>3</strong></td>
<td>Any <strong>3 of 6</strong> durable <code>prepare_ok</code>s → <strong>commit</strong></td>
</tr>
<tr>
<td>View-change</td>
<td style="text-align:right"><strong>4</strong></td>
<td>Need <strong>4 of 6</strong> for <code>exit_view</code> / <code>join_view</code> quorums</td>
</tr>
<tr>
<td>Nack</td>
<td style="text-align:right"><strong>4</strong></td>
<td>Need <strong>4</strong> nacks to truncate a maybe-uncommitted op</td>
</tr>
</tbody>
</table>
<p>You can <strong>commit more easily</strong> (only 3) than you can <strong>change leaders</strong> (need 4). That’s intentional.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="52" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="why-not-one-number-f--1">Why Not One Number ((f + 1))?</h2>
<p>Classic VR/Paxos: (N = 2f + 1), one majority (f + 1) for <em>everything</em>.</p>
<p>TigerBeetle uses <strong>flexible quorums</strong> (<a href="https://fpaxos.github.io/">Flexible Paxos</a>):</p>
<ul>
<li><strong>Smaller replication quorum</strong> → better <strong>availability for commits</strong></li>
<li><strong>Larger view-change quorum</strong> → safer when choosing a primary / log suffix</li>
<li>Safety: any replication-sized set and any view-change-sized set <strong>must intersect</strong>
<ul>
<li>So a new primary still learns every prepare that <strong>could have committed</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="53" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="where-view-change-quorum-shows-up">Where View-Change Quorum Shows Up</h2>
<p>In the protocol (<a href="https://github.com/tigerbeetle/tigerbeetle/blob/main/docs/internals/vsr.md">vsr.md</a>):</p>
<ol>
<li><strong>View-change quorum</strong> of <strong><code>exit_view</code></strong> → enter <code>view_change</code>, bump view, send <strong><code>join_view</code></strong></li>
<li><strong>View-change quorum</strong> of <strong><code>join_view</code></strong> → new primary installs suffix, repairs, broadcasts <strong><code>view</code></strong></li>
<li>Separately: <strong>nack quorum</strong> can truncate an op that never committed</li>
</ol>
<p>This table is about <strong>how many must participate</strong> — not a simple “how many can fail” chart.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="build" data-theme="rust-demo" lang="en-US" class="build" data-marpit-pagination="54" style="--paginate:true;--class:build;--theme:rust-demo;" data-marpit-pagination-total="57" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
