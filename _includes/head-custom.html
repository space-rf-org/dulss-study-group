{%- comment -%} Apply theme before paint to avoid light/dark flash {%- endcomment -%}
<script>
(function () {
  try {
    var stored = localStorage.getItem("theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%s' }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1e20" media="(prefers-color-scheme: dark)">
<script>
(function () {
  function currentTheme() {
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr === "light" || attr === "dark") return attr;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]:not([media])');
    // keep dual media metas; also set a default for browsers that ignore media
    var color = theme === "dark" ? "#1d1e20" : "#ffffff";
    var fallback = document.getElementById("theme-color-fallback");
    if (!fallback) {
      fallback = document.createElement("meta");
      fallback.id = "theme-color-fallback";
      fallback.name = "theme-color";
      document.head.appendChild(fallback);
    }
    fallback.content = color;
  }

  function ensureToggle() {
    if (document.getElementById("theme-toggle")) return;
    var btn = document.createElement("button");
    btn.id = "theme-toggle";
    btn.type = "button";
    btn.title = "Toggle light/dark theme (Alt+T)";
    btn.setAttribute("accesskey", "t");
    btn.setAttribute("aria-label", "Toggle light and dark theme");
    btn.innerHTML = '<span class="icon-moon" aria-hidden="true">☾</span><span class="icon-sun" aria-hidden="true">☀</span>';
    btn.addEventListener("click", function () {
      setTheme(currentTheme() === "dark" ? "light" : "dark");
    });
    document.body.appendChild(btn);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureToggle);
  } else {
    ensureToggle();
  }
})();
</script>
